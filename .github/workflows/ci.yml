name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krunditark
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Setup database
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U postgres -d krunditark -f supabase/ci-setup.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            PGPASSWORD=$POSTGRES_PASSWORD ON_ERROR_STOP=1 psql -h localhost -U postgres -d krunditark -f "$f"
          done

      - name: Verify fail-fast migration behavior
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          set +e
          PGPASSWORD=$POSTGRES_PASSWORD ON_ERROR_STOP=1 psql -h localhost -U postgres -d krunditark -c "SELECT intentionally_invalid_syntax_to_test_failfast;"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "ERROR: Invalid SQL did not cause psql to exit non-zero"
            exit 1
          fi
          echo "Fail-fast behavior verified: invalid SQL returned non-zero exit code $EXIT_CODE"

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/krunditark
        run: npm run test

      - name: Build
        run: npm run build
