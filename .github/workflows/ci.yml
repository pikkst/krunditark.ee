name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krunditark
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Setup database
        run: |
          psql -h localhost -U postgres -d krunditark -f supabase/ci-setup.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -U postgres -d krunditark -f "$f"
          done

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/krunditark
        run: npm run test

      - name: Build
        run: npm run build
