name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krunditark
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Setup database
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d krunditark -f supabase/ci-setup.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            PGPASSWORD=$POSTGRES_PASSWORD psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d krunditark -f "$f"
          done

      - name: Verify fail-fast migration behavior
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          cat > /tmp/failfast-test.sql <<'EOF'
          CREATE TABLE IF NOT EXISTS public.failfast_marker (id int);
          SELECT intentionally_invalid_syntax_to_test_failfast;
          INSERT INTO public.failfast_marker (id) VALUES (1);
          EOF
          set +e
          PGPASSWORD=$POSTGRES_PASSWORD psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d krunditark -f /tmp/failfast-test.sql
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "ERROR: Invalid SQL did not cause psql to exit non-zero"
            exit 1
          fi
          MARKER_COUNT=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U postgres -d krunditark -tAc "SELECT COUNT(*) FROM public.failfast_marker;" 2>/dev/null || echo "0")
          if [ "$MARKER_COUNT" -ne 0 ]; then
            echo "ERROR: Post-error marker statement executed; fail-fast did not stop processing"
            exit 1
          fi
          echo "Fail-fast behavior verified: invalid SQL returned non-zero exit code $EXIT_CODE and marker was not reached"

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/krunditark
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
